<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NICU 新生兒呼吸器實習測驗｜不同體重進階版</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#203044;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:20px 15px 60px}.hero{background:linear-gradient(130deg,#174d79,#267fa1);color:white;padding:26px 22px;border-radius:20px}.hero h1{font-size:25px;margin:0 0 10px}.hero p{margin:6px 0;line-height:1.6}.card{background:white;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 3px 15px #173b5710}.muted{color:#64748b}.qhead{font-size:14px;color:#16749a;font-weight:700}.question{font-size:18px;font-weight:700;line-height:1.65;margin:12px 0}.scenario{white-space:pre-line;background:#f1f7fa;border-left:4px solid #4c9ab7;padding:13px;border-radius:8px;line-height:1.7;margin:10px 0 15px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid #d8e4eb;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer;line-height:1.55}.option:has(input:checked){border-color:#147da4;background:#edf8fd}.option input{margin-top:4px;accent-color:#137ca1}input[type=text]{width:100%;padding:13px;border:1px solid #ccd9e3;border-radius:10px;font-size:16px}label.field{display:block;margin:14px 0 7px;font-weight:650}button{border:0;border-radius:11px;padding:14px 20px;font-weight:750;font-size:16px;cursor:pointer;background:#147da4;color:white}button.secondary{background:#e4eef3;color:#17465f}button:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;gap:10px;justify-content:space-between;margin-top:20px}.progress{height:9px;background:#dceaf1;border-radius:20px;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#3ba6c3;transition:width .2s}.hidden{display:none}.score{text-align:center;font-size:58px;font-weight:800;color:#147da4;margin:15px 0}.pill{display:inline-block;background:#e6f5f8;color:#176a83;padding:7px 13px;border-radius:99px;font-weight:700}.notice{background:#fff8e8;border:1px solid #f4dda2;padding:12px;border-radius:10px;line-height:1.6}.small{font-size:13px;line-height:1.6}.footer{text-align:center;color:#708090;font-size:12px;margin-top:20px}@media(max-width:500px){.hero h1{font-size:22px}.card{padding:17px}.question{font-size:17px}}.review-item{padding:16px;margin:12px 0;border:1px solid #dbe5ef;border-radius:12px;background:#fff}.review-item p{margin:9px 0;line-height:1.65}#review{margin-top:24px;text-align:left}#review h3{font-size:20px}</style></head><body><main class="wrap"><header class="hero"><h1>🫁 NICU 新生兒呼吸器實習測驗</h1><p>大四呼吸治療系實習生｜PC-SIMV＋PS・HFOV・ETT・ABG・CXR</p><p>20 題單選｜每題 5 分｜滿分 100 分</p></header><section id="intro" class="card"><h2>開始測驗</h2><p class="muted">請填寫姓名後開始。作答完畢會直接在手機顯示分數，請將結果畫面給臨床老師查看。</p><label class="field" for="name">學生姓名 *</label><input id="name" type="text" maxlength="30" placeholder="請輸入姓名" autocomplete="name"><label class="field" for="school">學校／實習梯次（選填）</label><input id="school" type="text" maxlength="50" placeholder="例如：○○大學／第一梯"><p class="notice small">本版不會上傳或儲存學生資料至伺服器。關閉或重新整理頁面後，測驗結果可能消失，請交卷後立即出示或截圖。</p><button id="start">開始作答 →</button></section><section id="quiz" class="card hidden"><div class="qhead" id="counter"></div><div class="progress"><div id="bar"></div></div><div id="qcontent"></div><div class="row"><button class="secondary" id="prev">← 上一題</button><button id="next">下一題 →</button></div></section><section id="result" class="card hidden"><div style="text-align:center"><span class="pill">測驗完成</span><h2>NICU 新生兒呼吸器實習測驗</h2><p id="student"></p><div class="score" id="score"></div><p id="correct"></p><p class="muted" id="finished"></p></div><p class="notice">請將此畫面出示給臨床老師，或截圖留存。分數僅顯示在本裝置上。</p><div class="row"><button class="secondary" onclick="window.print()">列印／另存 PDF</button><div id="review"></div><button id="restart">重新測驗</button></div></section><p class="footer">教學用途｜臨床處置以病況、設備說明及院內指引為準</p></main><script>

const questions=[{"t": "胎齡 26 週、出生體重 780 g 的早產兒因 RDS 需經口插管。下列哪一組 ETT 內徑與初步口唇深度最合理？", "o": ["3.5 mm／9 cm", "2.5 mm／約 6.5–7 cm", "3.0 mm／9 cm", "2.0 mm／5 cm"], "a": 1, "e": "極低體重早產兒常考慮 2.5 mm ETT；深度須依胎齡、體重與院內深度表估算，插管後確認管尖位置，不能只靠公式。"}, {"t": "出生體重 1,600 g 的早產兒，經口插管後聽診右側較大聲，左側胸廓起伏較小；CXR 顯示 ETT 尖端貼近 carina。最佳處置方向？", "o": ["先增加 FiO₂ 至 100%", "評估將 ETT 適度後退並再次確認位置", "增加 PS", "增加 RR"], "a": 1, "e": "懷疑 ETT 過深或接近右主支氣管，應由合格人員調整並再次確認深度及雙側通氣。"}, {"t": "插管後 EtCO₂ 有持續波形，但 SpO₂ 仍偏低。何者最合理？", "o": ["EtCO₂ 有波形即證明管尖深度完全正確", "應繼續評估雙側呼吸音、胸廓、氧合與 CXR 管尖位置", "直接拔管", "不必評估其他原因"], "a": 1, "e": "EtCO₂ 有助於確認氣管內位置，但不能取代管尖深度、單肺插管及肺部病變的評估。"}, {"t": "早產兒插管後突然 SpO₂ 下降、心跳變慢、呼吸器高壓警報，抽吸導管難以通過 ETT。最應優先懷疑？", "o": ["ETT 阻塞", "FiO₂ 太低是唯一原因", "PEEP 太低", "PS 太高"], "a": 0, "e": "突發惡化要依 DOPE 概念快速排除管路移位、阻塞、氣胸與設備故障，並立即確保有效通氣。"}, {"t": "一名 25 週、650 g 極低胎齡早產兒，因 RDS 插管後使用 PC-SIMV＋PS，肺部有適當起伏，血流動力學穩定。若希望採較低的初始吸氣壓力並密切監測，下列哪組設定最值得作為起始評估？", "o": ["PIP 14–15、PEEP 5 cmH₂O，並依 Vt、胸廓及 ABG 調整", "PIP 固定 25、PEEP 10，無須評估 Vt", "所有 650 g 早產兒 PIP 必須固定 14", "只需設定 FiO₂，不必設定 PEEP"], "a": 0, "e": "極低胎齡且肺順應性容許時，PIP 14–15 cmH₂O 可能足夠；這不是依體重固定的處方。需依呼出 Vt、胸廓起伏、血氣、漏氣與病況調整。"}, {"t": "一名 26 週、800 g 早產兒使用 PC-SIMV＋PS：PIP 15、PEEP 5、RR 40、Ti 0.3 秒。呼出 Vt 約 4.8 mL/kg，pH 7.32、PaCO₂ 49，SpO₂ 達目標。最佳判斷？", "o": ["因體重小，PIP 一定要提高至 20", "目前低 PIP 已達合宜通氣，可維持監測", "將 RR 立即提高至 70", "把 PEEP 降到 0"], "a": 1, "e": "設定是否足夠應以臨床反應為準，而非因 PIP 數值低就調高；此例 Vt、血氣與氧合均可接受。"}, {"t": "一名 30 週、1,400 g 早產兒使用 PC-SIMV＋PS：PIP 17、PEEP 5、RR 40、Ti 0.35 秒，Vt 2.7 mL/kg，pH 7.20、PaCO₂ 68；確認 ETT、漏氣與同步性後，較合理的方向？", "o": ["小幅評估增加 PIP 至 18–19 並追蹤 Vt 與血氣", "因為體重超過 1 kg，直接設 PIP 25", "降低 PIP 至 14", "只提高 FiO₂"], "a": 0, "e": "壓力控制模式下，Vt 偏低合併高碳酸血症可評估增加驅動壓；不應只按體重決定 PIP。"}, {"t": "兩名 RDS 早產兒分別為甲：25 週／700 g，乙：33 週／1,900 g，皆使用 PC-SIMV＋PS。關於初始 PIP 的判斷何者正確？", "o": ["甲一定需要比乙更高的 PIP", "乙一定需要比甲更高的 PIP", "兩者應固定同一 PIP", "體重與胎齡提供參考，但應以肺順應性、Vt、胸廓起伏與血氣個別化設定"], "a": 3, "e": "較小的早產兒可能在較低 PIP 下達到合宜 Vt，但不能建立單純『體重越小，PIP 越低』的固定規則。"}, {"t": "一名 34 週、2,200 g 早產兒，因肺炎造成肺順應性下降，PC-SIMV＋PS 使用 PIP 18、PEEP 5、FiO₂ 0.40，Vt 僅 3 mL/kg、PaCO₂ 65。與 26 週、800 g 且 Vt 已合宜的 RDS 病人相比，最合理的說法？", "o": ["兩人都應固定 PIP 15", "較重的病人一定不需要呼吸器", "肺炎個案可能需要較高驅動壓，應按實際 Vt、血氣與肺部病況調整", "只要增加 FiO₂ 就能改善 CO₂ 排除"], "a": 2, "e": "呼吸器壓力需求主要受肺順應性、氣道阻力及通氣目標影響，不能單靠體重判斷。"}, {"t": "一名 27 週、900 g 早產兒使用 PC-SIMV＋PS：PIP 15、PEEP 5，調整後 Vt 由 4.5 升至 7.2 mL/kg、PaCO₂ 降至 29。下列何者最合適？", "o": ["因 PIP 只有 15，不可能過度通氣", "評估肺順應性變化並適度降低驅動壓，避免過大 Vt", "繼續增加 PIP 至 20", "提高 RR 至 70"], "a": 1, "e": "即使 PIP 數字不高，肺順應性改善後仍可能造成 Vt 過大及低碳酸血症。"}, {"t": "早產兒由傳統呼吸器轉 HFOV，原 MAP 約 9 cmH₂O、氧合不足且影像顯示肺容積低。何種初始策略較合理？", "o": ["HFOV MAP 固定 5", "依原 MAP、氧合及肺容積評估略提高 MAP，再密切監測", "HFOV MAP 與肺容積無關", "直接將 MAP 固定 20"], "a": 1, "e": "HFOV 的 MAP 主要影響肺容積及氧合；初始值應依病況及原通氣設定個別化。"}, {"t": "HFOV：MAP 12、Amplitude 24、Frequency 12 Hz；pH 7.19、PaCO₂ 72，胸廓震盪偏弱，ETT 通暢。最合理的優先調整？", "o": ["增加 Amplitude 並追蹤 PaCO₂", "增加 Frequency 至 15 Hz 作為唯一處置", "僅增加 FiO₂", "降低 Amplitude"], "a": 0, "e": "HFOV 的 Amplitude 是 CO₂ 排除的重要控制因子；胸廓震盪不足時須先確認管路與病人狀況。"}, {"t": "HFOV：PaCO₂ 偏高，Amplitude 已足夠且胸廓震盪良好，排除 ETT 問題後仍需改善通氣。下列哪個頻率調整方向通常較可能增加 Vt、促進 CO₂ 排除？", "o": ["由 10 Hz 降至 8 Hz", "由 10 Hz 升至 15 Hz", "Frequency 與 CO₂ 排除無關", "一律將 MAP 降為 0"], "a": 0, "e": "在其他條件相近時，HFOV 降低頻率通常可增加每次震盪潮氣量並促進 CO₂ 排除，但需注意肺損傷風險。"}, {"t": "HFOV 治療中 FiO₂ 需求持續上升，CXR 顯示肺過度擴張、橫膈扁平，血壓下降。最適當的判斷？", "o": ["MAP 可能過高，應評估過度擴張及血流動力學", "一定要繼續提高 MAP", "只需增加 Frequency", "這是典型肺容積不足"], "a": 0, "e": "過度擴張可能降低靜脈回流並影響氧合，須綜合評估 MAP、影像、血壓及其他病因。"}, {"t": "一名 29 週、1,100 g 早產兒 PC-SIMV＋PS：PIP 16、PEEP 5、RR 45，ABG pH 7.28、PaCO₂ 56、HCO₃⁻ 25，SpO₂ 達目標且 Vt 合宜。最佳解讀？", "o": ["一律提高 PIP 到 20", "輕度呼吸性酸中毒，是否調整應考慮允許性高碳酸血症策略與臨床狀況", "一定要將 PaCO₂ 降到 30 以下", "必須把 FiO₂ 提高至 100%"], "a": 1, "e": "部分早產兒採允許性高碳酸血症策略，須綜合 pH、趨勢、Vt、氧合與臨床情況，而非追求單一 PaCO₂ 數值。"}, {"t": "調整 PC-SIMV＋PS 後，PaCO₂ 由 65 降至 42 mmHg，但 PaO₂ 仍偏低、SpO₂ 88%，FiO₂ 0.50。何者最正確？", "o": ["通氣改善，但氧合仍需另外評估", "通氣與氧合都已完全改善", "PaCO₂ 下降表示一定過度通氣", "應只降低 RR"], "a": 0, "e": "PaCO₂ 主要反映通氣，PaO₂／SpO₂ 與 FiO₂ 需求則協助評估氧合；兩者不可混為一談。"}, {"t": "一名 RDS 早產兒 CXR 顯示 ETT 位置適當、雙肺磨玻璃陰影與 air bronchogram，且肺容積低。最可能的主要病理機轉？", "o": ["表面張力增加導致肺泡塌陷及順應性下降", "氣道完全沒有阻力", "單側大量氣胸", "肺泡過度擴張是唯一原因"], "a": 0, "e": "RDS 常與肺表面張力素不足相關，造成肺泡塌陷、低肺容積及肺順應性下降。"}, {"t": "插管新生兒突然血氧下降、心搏過緩，右側呼吸音減弱，胸廓不對稱且血壓下降。確認 ETT 未移位後，應優先警覺？", "o": ["張力性氣胸等急性氣漏", "只需等待下一次例行 CXR", "單純 PS 不足", "只是 SpO₂ 探頭問題"], "a": 0, "e": "突發單側呼吸音減弱合併循環不穩，需高度懷疑氣胸並立即依急救流程處置，不應延誤。"}, {"t": "PC-SIMV＋PS 設定不變，給予 surfactant 後，Vt 從 4.5 升至 7.5 mL/kg、PaCO₂ 由 52 降至 30。最佳判斷？", "o": ["肺順應性可能改善，應及時重新評估 PIP 以避免過度通氣", "應繼續增加 PIP", "立即將 FiO₂ 調至 100%", "此變化與肺順應性無關"], "a": 0, "e": "表面張力素後肺順應性可能快速改善；壓力控制模式下 Vt 可能上升，須密切監測並調整支持。"}, {"t": "比較三位插管早產兒：甲 25 週／700 g，PIP 14、Vt 4.8 mL/kg、PaCO₂ 48；乙 30 週／1,400 g，PIP 17、Vt 4.6、PaCO₂ 46；丙 34 週／2,200 g，PIP 19、Vt 3.0、PaCO₂ 68。哪個結論最正確？", "o": ["PIP 應全部改為 20", "甲因 PIP 14 太低，必須調高", "丙雖 PIP 較高仍可能通氣不足，需評估肺順應性、ETT、漏氣與設定；甲乙可依狀況持續監測", "只看體重就能決定三人的 PIP"], "a": 2, "e": "同一壓力對不同病人的 Vt 與 CO₂ 排除效果不同；應以個別化生理反應判斷是否需要調整。"}];
let index=0, answers=Array(questions.length).fill(null), studentName='', school='';
const $=id=>document.getElementById(id);
function goTop(){window.scrollTo(0,0);}
function render(){
 const q=questions[index];
 $('counter').textContent=`第 ${index+1} / ${questions.length} 題｜已作答 ${answers.filter(x=>x!==null).length} 題`;
 $('bar').style.width=`${(index+1)/questions.length*100}%`;
 const content=$('qcontent'); content.replaceChildren();
 const title=document.createElement('div');title.className='question';title.textContent=q.t;content.append(title);
 q.o.forEach((option,i)=>{
   const label=document.createElement('label');label.className='option';
   const input=document.createElement('input');input.type='radio';input.name='choice';input.value=i;input.checked=answers[index]===i;
   input.addEventListener('change',()=>{answers[index]=i;render();});
   const span=document.createElement('span');span.textContent=`${'ABCD'[i]}. ${option}`;
   label.append(input,span);content.append(label);
 });
 $('prev').disabled=index===0;
 $('next').textContent=index===questions.length-1?'確認交卷 ✓':'下一題 →';
}
$('start').addEventListener('click',()=>{
 studentName=$('name').value.trim();school=$('school').value.trim();
 if(!studentName){alert('請先填寫學生姓名');$('name').focus();return;}
 $('intro').classList.add('hidden');$('quiz').classList.remove('hidden');render();goTop();
});
$('prev').addEventListener('click',()=>{if(index>0){index--;render();goTop();}});
$('next').addEventListener('click',()=>{
 if(answers[index]===null){alert('請先選擇答案');return;}
 if(index<questions.length-1){index++;render();goTop();return;}
 const missing=answers.findIndex(x=>x===null);
 if(missing!==-1){index=missing;render();alert(`第 ${missing+1} 題尚未作答`);return;}
 if(!confirm('確定交卷嗎？交卷後會顯示分數、錯題及解析。'))return;
 const correct=answers.filter((answer,i)=>answer===questions[i].a).length;
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
 $('student').textContent=`姓名：${studentName}${school?'｜'+school:''}`;
 $('score').textContent=`${correct*5} 分`;
 $('correct').textContent=`答對 ${correct} / ${questions.length} 題｜答錯 ${questions.length-correct} 題`;
 $('finished').textContent=`交卷時間：${new Date().toLocaleString('zh-TW',{hour12:false})}`;
 const review=$('review');review.replaceChildren();
 const heading=document.createElement('h3');heading.textContent=`錯題回顧（${questions.length-correct} 題）`;review.append(heading);
 if(correct===questions.length){const p=document.createElement('p');p.textContent='全部答對！';review.append(p);}
 questions.forEach((q,i)=>{
   if(answers[i]===q.a)return;
   const item=document.createElement('div');item.className='review-item';
   const h=document.createElement('strong');h.textContent=`第 ${i+1} 題｜${q.t}`;
   const wrong=document.createElement('p');wrong.textContent=`你的答案：${'ABCD'[answers[i]]}. ${q.o[answers[i]]}`;
   const right=document.createElement('p');right.textContent=`正確答案：${'ABCD'[q.a]}. ${q.o[q.a]}`;
   const explanation=document.createElement('p');explanation.textContent=`解析：${q.e}`;
   item.append(h,wrong,right,explanation);review.append(item);
 });
 goTop();
});
$('restart').addEventListener('click',()=>{if(confirm('重新測驗將清除本次作答，確定嗎？'))location.reload();});

</script></body></html>
